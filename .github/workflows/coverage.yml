name: Coverage Badge

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  coverage:
    if: "!startsWith(github.event.head_commit.message, 'chore/')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > androidApp/google-services.json

      - name: Generate unit test coverage report
        run: ./gradlew koverXmlReportFruitHalfDebug -PcoverageTestExclude='com.wojdor.memolki.screenshot.*' --build-cache

      - name: Extract unit test coverage
        id: unit
        run: |
          REPORT=$(find androidApp/build -name "*.xml" -path "*/kover/*" | head -1)
          if [ -z "$REPORT" ]; then echo "No report found"; exit 1; fi
          LINE_COVERED=$(grep -oP 'type="LINE"[^/]*covered="\K[0-9]+' "$REPORT" | tail -1)
          LINE_MISSED=$(grep -oP 'type="LINE"[^/]*missed="\K[0-9]+' "$REPORT" | tail -1)
          TOTAL=$((LINE_COVERED + LINE_MISSED))
          PERCENTAGE=$((TOTAL > 0 ? LINE_COVERED * 100 / TOTAL : 0))
          if [ "$PERCENTAGE" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$PERCENTAGE" -ge 60 ]; then COLOR="green"
          elif [ "$PERCENTAGE" -ge 40 ]; then COLOR="yellow"
          elif [ "$PERCENTAGE" -ge 20 ]; then COLOR="orange"
          else COLOR="red"
          fi
          echo "percentage=$PERCENTAGE" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Update unit test coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: memolki-coverage.json
          label: coverage
          message: ${{ steps.unit.outputs.percentage }}%
          color: ${{ steps.unit.outputs.color }}

