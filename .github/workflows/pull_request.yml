name: Pull Request Workflow

on:
  pull_request:

jobs:
  tests-execution:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/') }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Run unit tests with coverage
        run: ./gradlew koverXmlReportFruitHalfDebug -PcoverageTestExclude='com.wojdor.memolki.screenshot.*' --build-cache

      - name: Add coverage to summary
        if: always()
        run: |
          REPORT=$(find app/build -name "*.xml" -path "*/kover/*" | head -1)
          if [ -n "$REPORT" ]; then
            LINE_COVERED=$(grep -oP 'type="LINE"[^/]*covered="\K[0-9]+' "$REPORT" | tail -1)
            LINE_MISSED=$(grep -oP 'type="LINE"[^/]*missed="\K[0-9]+' "$REPORT" | tail -1)
            TOTAL=$((LINE_COVERED + LINE_MISSED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENTAGE=$((LINE_COVERED * 100 / TOTAL))
              echo "### 🧪 Code Coverage: ${PERCENTAGE}%" >> $GITHUB_STEP_SUMMARY
              echo "Lines covered: $LINE_COVERED / $TOTAL" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # TODO: Remove continue-on-error once Paparazzi 2.0.0-alpha05 adds AGP 9 support
      # Tracked: https://github.com/cashapp/paparazzi/pull/2198
      - name: Verify screenshot tests
        continue-on-error: true
        run: ./gradlew verifyPaparazziFruitHalfDebug --build-cache

      - name: Upload screenshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-failures
          path: app/build/paparazzi/failures/
          retention-days: 14

  unit-test:
    needs: [tests-execution]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify tests-execution outcome
        run: |
          result="${{ needs.tests-execution.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "✅ All checks passed or were intentionally skipped."
          else
            echo "❌ tests-execution finished with result: $result"
            exit 1
          fi
