name: iosApp
options:
  bundleIdPrefix: com.wojdor.memolki
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  schemePathPrefix: ""
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targetTemplates:
  iosAppFlavor:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "Localizations/**"
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "1.3.35"
        CFBundleVersion: "1003035"
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        MARKETING_VERSION: "1.3.35"
        CURRENT_PROJECT_VERSION: "1003035"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"iosApp/Preview Content\""
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  iosApp-FruitHalf:
    templates: [iosAppFlavor]
    sources:
      - path: iosApp/Localizations/FruitHalf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wojdor.memolki.fruithalf
        BUNDLE_DISPLAY_NAME: "memolki • fruits"
  iosApp-VegetableHalf:
    templates: [iosAppFlavor]
    sources:
      - path: iosApp/Localizations/VegetableHalf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wojdor.memolki.vegetablehalf
        BUNDLE_DISPLAY_NAME: "memolki • vegetables"
  iosApp-MammalSide:
    templates: [iosAppFlavor]
    sources:
      - path: iosApp/Localizations/MammalSide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wojdor.memolki.mammalside
        BUNDLE_DISPLAY_NAME: "memolki • mammals"
  iosApp-BirdSide:
    templates: [iosAppFlavor]
    sources:
      - path: iosApp/Localizations/BirdSide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wojdor.memolki.birdside
        BUNDLE_DISPLAY_NAME: "memolki • birds"

# Each scheme writes its flavor to iosApp/.active-flavor BEFORE the build runs.
# shared/build.gradle.kts reads that file at configuration time so the Pods
# script_phase (:shared:syncFramework) builds with only the active flavor's
# <flavor>Main source set joining iosMain — per-flavor lean iOS framework.
schemes:
  iosApp-FruitHalf:
    build:
      preActions:
        - name: "Set active iOS flavor"
          script: |
            cd "${SRCROOT}"
            echo fruitHalf > .active-flavor
          settingsTarget: iosApp-FruitHalf
      targets:
        iosApp-FruitHalf: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  iosApp-VegetableHalf:
    build:
      preActions:
        - name: "Set active iOS flavor"
          script: |
            cd "${SRCROOT}"
            echo vegetableHalf > .active-flavor
          settingsTarget: iosApp-VegetableHalf
      targets:
        iosApp-VegetableHalf: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  iosApp-MammalSide:
    build:
      preActions:
        - name: "Set active iOS flavor"
          script: |
            cd "${SRCROOT}"
            echo mammalSide > .active-flavor
          settingsTarget: iosApp-MammalSide
      targets:
        iosApp-MammalSide: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  iosApp-BirdSide:
    build:
      preActions:
        - name: "Set active iOS flavor"
          script: |
            cd "${SRCROOT}"
            echo birdSide > .active-flavor
          settingsTarget: iosApp-BirdSide
      targets:
        iosApp-BirdSide: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
