name: Merge Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      commit_title: ${{ steps.get_commit_title.outputs.commit_title }}
    steps:
      - name: Get and normalize commit title
        id: get_commit_title
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          commit_title=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          echo "commit_title=${commit_title,,}" >> $GITHUB_OUTPUT

  build_and_upload:
    needs: vars
    if: "!startsWith(needs.vars.outputs.commit_title, 'chore/')"
    strategy:
      matrix:
        flavor: [ "fruitHalf", "vegetableHalf", "mammalSide", "birdSide" ]
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version name
        id: version
        run: |
          version_name=$(grep "versionName" app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          echo "version_name=$version_name" >> $GITHUB_OUTPUT

      - name: Prepare flavor strings
        id: string_ops
        run: |
          echo "capitalized_flavor=$(echo ${{ matrix.flavor }} | sed 's/./\u&/')" >> $GITHUB_ENV
          echo "lowercase_flavor=$(echo ${{ matrix.flavor }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > key.jks

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3.4.1
        with:
          arguments: app:bundle${{ env.capitalized_flavor }}Release --stacktrace --no-daemon --build-cache
        env:
          FRUIT_HALF_BILLING_KEY: ${{ secrets.FRUIT_HALF_BILLING_KEY }}
          VEGETABLE_HALF_BILLING_KEY: ${{ secrets.VEGETABLE_HALF_BILLING_KEY }}
          MAMMAL_SIDE_BILLING_KEY: ${{ secrets.MAMMAL_SIDE_BILLING_KEY }}
          BIRD_SIDE_BILLING_KEY: ${{ secrets.BIRD_SIDE_BILLING_KEY }}
          KEYSTORE_PATH: ${{ github.workspace }}/key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.wojdor.memolki.${{ env.lowercase_flavor }}
          releaseFiles: "app/build/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab"
          mappingFile: "app/build/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt"
          track: production

  tag_version:
    needs: build_and_upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag "v/${{ needs.build_and_upload.outputs.version_name }}"
          git push origin "v/${{ needs.build_and_upload.outputs.version_name }}"

  bump_version:
    needs: tag_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bumper
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          current_version_name=$(grep "versionName" app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          last_tag_name=$(git tag --sort=-v:refname | grep -E '^v/' | head -n 1 | sed 's/v\///')
          
          if [ -z "$last_tag_name" ]; then
            last_version_name=$current_version_name
          else
            last_version_name=$last_tag_name
          fi
          
          major_current=$(echo $current_version_name | cut -d. -f1)
          minor_current=$(echo $current_version_name | cut -d. -f2)
          patch_current=$(echo $current_version_name | cut -d. -f3)
          
          major_last=$(echo $last_version_name | cut -d. -f1)
          minor_last=$(echo $last_version_name | cut -d. -f2)
          patch_last=$(echo $last_version_name | cut -d. -f3)
          
          new_patch=$((patch_current + 1))
          new_major=$major_current
          new_minor=$minor_current
          
          if [ "$major_current" -gt "$major_last" ] || [ "$minor_current" -gt "$minor_last" ]; then
            new_patch=0
            echo "Detected manual version increase (Major or Minor). Patch version will be reset to 0."
          fi
          
          current_version_code=$(grep "versionCode" app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          new_version_code=$((current_version_code + 1))
          new_version_name="$new_major.$new_minor.$new_patch"
          
          sed -i "s/versionCode = $current_version_code/versionCode = $new_version_code/" app/build.gradle.kts
          sed -i "s/versionName = \"$current_version_name\"/versionName = \"$new_version_name\"/" app/build.gradle.kts

          echo "new_version=$new_version_name" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6.1.0
        with:
          token: ${{ secrets.PAT }}
          commit-message: "Bump version to ${{ steps.bumper.outputs.new_version }}"
          title: "Chore/version bump ${{ steps.bumper.outputs.new_version }}"
          body: Automates version bump to ${{ steps.bumper.outputs.new_version }}
          branch: "chore/version-bump-${{ steps.bumper.outputs.new_version }}"
          delete-branch: true
          labels: "chore"
