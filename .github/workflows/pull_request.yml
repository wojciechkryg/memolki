name: Pull Request Workflow

on:
  pull_request:

jobs:
  tests-execution:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/') }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testFruitHalfDebugUnitTest --build-cache

      # TODO: Remove continue-on-error once Paparazzi 2.0.0-alpha05 adds AGP 9 support
      # Tracked: https://github.com/cashapp/paparazzi/pull/2198
      - name: Verify screenshot tests
        continue-on-error: true
        run: ./gradlew verifyPaparazziFruitHalfDebug --build-cache

      - name: Upload screenshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-failures
          path: app/build/paparazzi/failures/
          retention-days: 14

  debug-flags-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for enabled debug flags
        run: |
          if grep -r 'RECORDING_MODE = true' app/src/; then
            echo "::error::🚨 RECORDING_MODE is enabled. Disable it before merging."
            exit 1
          fi

  unit-test:
    needs: [tests-execution, debug-flags-check]
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.tests-execution.result == 'success' || needs.tests-execution.result == 'skipped') && needs.debug-flags-check.result == 'success' }}
    steps:
      - name: All checks passed
        run: echo "✅ All checks passed or were intentionally skipped."
