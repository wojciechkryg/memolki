name: Pull Request Workflow

on:
  pull_request_target:

jobs:
  tests-execution:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/') }}

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run unit tests
        uses: gradle/gradle-build-action@53b39578be91d3c101569335805537553f191544 # v3.2.1
        with:
          arguments: testFruitHalfDebugUnitTest --no-daemon --build-cache

  unit-test:
    needs: tests-execution
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.tests-execution.result == 'success' || needs.tests-execution.result == 'skipped') }}
    steps:
      - name: All checks passed
        run: echo "All checks passed or were intentionally skipped."
