name: Pull Request Workflow

on:
  pull_request_target:

jobs:
  tests-execution:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/') }}

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run unit tests
        run: ./gradlew testFruitHalfDebugUnitTest --no-daemon --build-cache

  unit-test:
    needs: tests-execution
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.tests-execution.result == 'success' || needs.tests-execution.result == 'skipped') }}
    steps:
      - name: All checks passed
        run: echo "All checks passed or were intentionally skipped."
